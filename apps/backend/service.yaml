apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: ClusterIP
  # 예전에 호스트 nginx가 이 주소로 연결해서 고정했다. 지금은 Ingress가 서비스 이름으로 연결하므로 필요 없지만,
  # 바꾸면 서비스를 다시 만들어야 해서 그대로 둔다.
  clusterIP: 10.43.161.91
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 3000
