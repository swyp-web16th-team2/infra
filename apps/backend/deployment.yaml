apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  # 배포할 때마다 생기는 옛 레플리카셋(되돌리기용 기록)을 최근 3개만 남긴다. 기본값은 10개.
  # 되돌리기는 backend에 revert를 병합하는 방식을 쓰므로(README) 많이 남길 필요가 없다.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # 이 앱은 쿠버네티스 API를 쓰지 않으므로 서비스 계정 토큰을 마운트하지 않는다.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # 태그는 backend 레포 main의 커밋 SHA. 새 버전을 배포하려면 이 줄을 바꾼다.
          image: ghcr.io/swyp-web16th-team2/backend:5e137c281e25015630aa9435f3d7eeea9e4f7d64
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # 브라우저에서 API를 부를 수 있는 주소(쉼표로 구분). 프론트엔드 배포 주소가 정해지면 여기에 추가한다.
            - name: CORS_ORIGINS
              value: "http://localhost:3000,http://localhost:5173"
            # 같은 네임스페이스의 Redis 서비스(redis.yaml).
            - name: REDIS_URL
              value: "redis://redis:6379"
            # Supabase Postgres 접속 주소(트랜잭션 풀러). 비밀이라 레포에 값을 두지 않고 시크릿 backend-db에서 읽는다.
            # 시크릿이 없어도 서버는 뜨고 /health가 db: down으로 알려 준다. 시크릿 만드는 법은 README 참고.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-db
                  key: DATABASE_URL
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
